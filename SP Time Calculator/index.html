<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP Time Calculator</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1d21;
    --muted: #6b7079;
    --border: #d9dce1;
    --accent: #2563eb;
    --accent-soft: #e8efff;
    --error: #d93025;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --card: #1b1e23;
      --text: #eef0f3;
      --muted: #9aa0aa;
      --border: #2e333a;
      --accent: #6b9bff;
      --accent-soft: #1d2a45;
      --error: #ff6b61;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .hint { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; line-height: 1.4; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: grid;
    gap: 16px;
  }
  .field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; }
  .card { grid-template-columns: minmax(0, 1fr); }
  .field > label { font-weight: 600; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: baseline; }
  .tag { font-size: 0.75rem; font-weight: 600; color: var(--accent); visibility: hidden; }
  .inputs { display: flex; gap: 8px; }
  input {
    flex: 1;
    min-width: 0;
    width: 100%;
    font: inherit;
    font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    min-height: 56px;
  }
  input::placeholder { color: var(--muted); opacity: 0.6; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ampm {
    width: 72px;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  .computed input, .computed .ampm { background: var(--accent-soft); border-color: var(--accent); }
  .computed .tag { visibility: visible; }
  .invalid input { border-color: var(--error); }
  .sub { color: var(--muted); font-size: 0.85rem; min-height: 1.2em; }
  .invalid .sub { color: var(--error); }
  .clear {
    font: inherit;
    font-weight: 600;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
<main>
  <h1>SP Time Calculator</h1>
  <p class="hint">Fill in any two fields and the third is calculated. Type times as numbers: <b>345</b> becomes <b>3:45</b>.</p>

  <div class="card">
    <div class="field" id="f-start">
      <label for="start">Start time <span class="tag">Calculated</span></label>
      <div class="inputs">
        <input type="text" id="start" inputmode="numeric" autocomplete="off" placeholder="0:00">
        <button type="button" class="ampm" id="start-ampm" data-pm="0">AM</button>
      </div>
      <span class="sub" id="start-note"></span>
    </div>

    <div class="field" id="f-end">
      <label for="end">End time <span class="tag">Calculated</span></label>
      <div class="inputs">
        <input type="text" id="end" inputmode="numeric" autocomplete="off" placeholder="0:00">
        <button type="button" class="ampm" id="end-ampm" data-pm="1">PM</button>
      </div>
      <span class="sub" id="end-note"></span>
    </div>

    <div class="field" id="f-hours">
      <label for="hours">Total hours (decimal) <span class="tag">Calculated</span></label>
      <div class="inputs">
        <input type="text" id="hours" inputmode="decimal" autocomplete="off" placeholder="0.00">
      </div>
      <span class="sub" id="hours-note"></span>
    </div>

    <button type="button" class="clear" id="clear">Clear</button>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const DAY = 1440;
  const KEYS = ['start', 'end', 'hours'];
  const DEFAULT_PM = { start: false, end: true };
  // Most recently edited first; the field not in the top two is calculated.
  let order = ['start', 'end', 'hours'];

  const isPM = k => $(k + '-ampm').dataset.pm === '1';
  function setPM(k, pm) {
    const b = $(k + '-ampm');
    b.dataset.pm = pm ? '1' : '0';
    b.textContent = pm ? 'PM' : 'AM';
  }

  // Digits as typed -> "3", "34", "3:45", "12:30"
  function formatDigits(d) {
    if (d.length <= 2) return d;
    return d.slice(0, d.length - 2) + ':' + d.slice(-2);
  }

  // Returns minutes after midnight, or null. `final` accepts "3" as 3:00.
  function readTime(k, final) {
    const d = $(k).value.replace(/\D/g, '');
    if (!d) return null;
    let h, m;
    if (d.length >= 3) { h = +d.slice(0, -2); m = +d.slice(-2); }
    else if (final) { h = +d; m = 0; }
    else return null;
    if (m > 59 || h > 23) return NaN;
    if (h === 0 || h > 12) return h * 60 + m;          // 24-hour entry, e.g. 1345 or 0030
    return ((h % 12) + (isPM(k) ? 12 : 0)) * 60 + m;
  }

  function writeTime(k, min) {
    min = ((Math.round(min) % DAY) + DAY) % DAY;
    const h24 = Math.floor(min / 60), m = min % 60;
    $(k).value = ((h24 % 12) || 12) + ':' + String(m).padStart(2, '0');
    setPM(k, h24 >= 12);
  }

  // Turn a 24-hour entry like 13:45 into 1:45 PM once the user leaves the field.
  function normalize(k) {
    const min = readTime(k, true);
    if (min != null && !isNaN(min)) writeTime(k, min);
  }

  function readHours() {
    const v = $('hours').value.trim();
    if (!v) return null;
    const n = parseFloat(v);
    return isNaN(n) || n < 0 ? NaN : n;
  }

  function calculate(final) {
    const target = order[2];
    for (const k of KEYS) $('f-' + k).classList.toggle('computed', k === target);

    const s = target === 'start' ? null : readTime('start', final || order[0] !== 'start');
    const e = target === 'end' ? null : readTime('end', final || order[0] !== 'end');
    const h = target === 'hours' ? null : readHours();
    const ok = v => v != null && !isNaN(v);

    if (target === 'hours') {
      $('hours').value = ok(s) && ok(e) ? (((e - s + DAY) % DAY) / 60).toFixed(2) : '';
    } else if (target === 'end') {
      if (ok(s) && ok(h)) writeTime('end', s + h * 60); else { $('end').value = ''; setPM('end', DEFAULT_PM.end); }
    } else {
      if (ok(e) && ok(h)) writeTime('start', e - h * 60); else { $('start').value = ''; setPM('start', DEFAULT_PM.start); }
    }

    // Notes and validation
    for (const k of ['start', 'end']) {
      const bad = Number.isNaN(readTime(k, true));
      $('f-' + k).classList.toggle('invalid', bad);
      $(k + '-note').textContent = bad ? 'Not a valid time' : '';
    }
    const hv = readHours();
    $('f-hours').classList.toggle('invalid', Number.isNaN(hv));
    if (Number.isNaN(hv)) $('hours-note').textContent = 'Enter a number, e.g. 7.5';
    else if (hv != null) { const t = Math.round(hv * 60); $('hours-note').textContent = `= ${Math.floor(t / 60)} h ${t % 60} min`; }
    else $('hours-note').textContent = '';

    const sm = readTime('start', true), em = readTime('end', true);
    if (ok(sm) && ok(em) && em < sm && !$('end-note').textContent) $('end-note').textContent = 'Next day';
  }

  function touch(k) { order = [k, ...order.filter(x => x !== k)]; }

  for (const k of ['start', 'end']) {
    const input = $(k);
    input.addEventListener('input', () => {
      const raw = input.value;
      if (/a/i.test(raw)) setPM(k, false);
      if (/p/i.test(raw)) setPM(k, true);
      input.value = formatDigits(raw.replace(/\D/g, '').slice(0, 4));
      touch(k);
      calculate(false);
    });
    input.addEventListener('blur', () => { normalize(k); calculate(true); });
    input.addEventListener('keydown', ev => { if (ev.key === 'Enter') input.blur(); });
    $(k + '-ampm').addEventListener('click', () => {
      setPM(k, !isPM(k));
      if (order[2] !== k) touch(k); // flipping AM/PM on an entered time counts as editing it
      calculate(true);
    });
  }

  $('hours').addEventListener('input', () => {
    const el = $('hours');
    el.value = el.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1');
    touch('hours');
    calculate(false);
  });
  $('hours').addEventListener('blur', () => calculate(true));
  $('hours').addEventListener('keydown', ev => { if (ev.key === 'Enter') $('hours').blur(); });

  $('clear').addEventListener('click', () => {
    for (const k of KEYS) $(k).value = '';
    setPM('start', DEFAULT_PM.start);
    setPM('end', DEFAULT_PM.end);
    order = ['start', 'end', 'hours'];
    calculate(true);
    $('start').focus();
  });

  calculate(true);
</script>
</body>
</html>
