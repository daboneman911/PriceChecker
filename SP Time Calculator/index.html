<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SP Time">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>SP Time Calculator</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1d21;
    --muted: #6b7079;
    --border: #d9dce1;
    --accent: #2563eb;
    --accent-soft: #e8efff;
    --error: #d93025;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --card: #1b1e23;
      --text: #eef0f3;
      --muted: #9aa0aa;
      --border: #2e333a;
      --accent: #6b9bff;
      --accent-soft: #1d2a45;
      --error: #ff6b61;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: calc(32px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 1.5rem; margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: grid;
    gap: 16px;
  }
  .field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; }
  .card { grid-template-columns: minmax(0, 1fr); }
  .field > label { font-weight: 600; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: baseline; }
  .tag { font-size: 0.75rem; font-weight: 600; color: var(--accent); visibility: hidden; }
  .inputs { display: flex; gap: 8px; }
  input {
    flex: 1;
    min-width: 0;
    width: 100%;
    font: inherit;
    font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    min-height: 56px;
  }
  input::placeholder { color: var(--muted); opacity: 0.6; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .computed input { background: var(--accent-soft); border-color: var(--accent); }
  .computed .tag { visibility: visible; }
  .invalid input { border-color: var(--error); }
  .sub { color: var(--muted); font-size: 0.85rem; min-height: 1.2em; }
  .invalid .sub { color: var(--error); }
  .clear {
    font: inherit;
    font-weight: 600;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
<main>
  <h1>SP Time Calculator</h1>

  <div class="card">
    <div class="field" id="f-start">
      <label for="start">Start time <span class="tag">Calculated</span></label>
      <input type="text" id="start" inputmode="numeric" autocomplete="off" placeholder="0:00">
      <span class="sub" id="start-note"></span>
    </div>

    <div class="field" id="f-end">
      <label for="end">End time <span class="tag">Calculated</span></label>
      <input type="text" id="end" inputmode="numeric" autocomplete="off" placeholder="0:00">
      <span class="sub" id="end-note"></span>
    </div>

    <div class="field" id="f-hours">
      <label for="hours">Total hours (decimal) <span class="tag">Calculated</span></label>
      <input type="text" id="hours" inputmode="decimal" autocomplete="off" placeholder="0.00">
      <span class="sub" id="hours-note"></span>
    </div>

    <button type="button" class="clear" id="clear">Clear</button>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const KEYS = ['start', 'end', 'hours'];
  // Workday runs 8 AM - 5 PM, so 8-11 read as morning and 12, 1-7 as afternoon.
  const DAY_START = 8 * 60, DAY_END = 20 * 60; // times a 12-hour entry can represent: 8:00 AM - 7:59 PM
  // Most recently edited first; the field not in the top two is calculated.
  let order = ['start', 'end', 'hours'];

  const formatDigits = d => d.length <= 2 ? d : d.slice(0, -2) + ':' + d.slice(-2);

  // Minutes after midnight, null if empty/incomplete, NaN if invalid. `final` accepts "3" as 3:00.
  function readTime(k, final) {
    const d = $(k).value.replace(/\D/g, '');
    if (!d) return null;
    let h, m;
    if (d.length >= 3) { h = +d.slice(0, -2); m = +d.slice(-2); }
    else if (final) { h = +d; m = 0; }
    else return null;
    if (m > 59 || h > 23 || h === 0) return NaN;
    if (h < 8) h += 12;               // 1-7 -> 1 PM - 7 PM
    return h * 60 + m;
  }

  function writeTime(k, min) {
    min = Math.round(min);
    if (min < DAY_START || min >= DAY_END) { $(k).value = ''; return false; }
    const h = Math.floor(min / 60), m = min % 60;
    $(k).value = ((h % 12) || 12) + ':' + String(m).padStart(2, '0');
    return true;
  }

  // Turn a 24-hour entry like 13:45 into 1:45 once the user leaves the field.
  function normalize(k) {
    const min = readTime(k, true);
    if (min != null && !isNaN(min)) writeTime(k, min);
  }

  function readHours() {
    const v = $('hours').value.trim();
    if (!v) return null;
    const n = parseFloat(v);
    return isNaN(n) || n < 0 ? NaN : n;
  }

  function setNote(k, text, bad) {
    $(k + '-note').textContent = text;
    $('f-' + k).classList.toggle('invalid', !!bad);
  }

  function calculate(final) {
    const target = order[2];
    for (const k of KEYS) $('f-' + k).classList.toggle('computed', k === target);

    const s = target === 'start' ? null : readTime('start', final || order[0] !== 'start');
    const e = target === 'end' ? null : readTime('end', final || order[0] !== 'end');
    const h = target === 'hours' ? null : readHours();
    const ok = v => v != null && !isNaN(v);

    for (const k of KEYS) setNote(k, '');
    if (Number.isNaN(s)) setNote('start', 'Not a valid time', true);
    if (Number.isNaN(e)) setNote('end', 'Not a valid time', true);
    if (Number.isNaN(h)) setNote('hours', 'Enter a number, e.g. 7.5', true);

    if (target === 'hours') {
      $('hours').value = '';
      if (ok(s) && ok(e)) {
        if (e < s) setNote('end', 'End must be after start', true);
        else $('hours').value = ((e - s) / 60).toFixed(2);
      }
    } else if (target === 'end') {
      $('end').value = '';
      if (ok(s) && ok(h) && !writeTime('end', s + h * 60)) setNote('end', 'Goes past 7:59 PM', true);
    } else {
      $('start').value = '';
      if (ok(e) && ok(h) && !writeTime('start', e - h * 60)) setNote('start', 'Starts before 8:00 AM', true);
    }

    const hv = readHours();
    if (ok(hv)) { const t = Math.round(hv * 60); setNote('hours', `= ${Math.floor(t / 60)} h ${t % 60} min`); }
  }

  function touch(k) { order = [k, ...order.filter(x => x !== k)]; }

  for (const k of ['start', 'end']) {
    const input = $(k);
    input.addEventListener('input', () => {
      input.value = formatDigits(input.value.replace(/\D/g, '').slice(0, 4));
      touch(k);
      calculate(false);
    });
    input.addEventListener('blur', () => { normalize(k); calculate(true); });
    input.addEventListener('keydown', ev => { if (ev.key === 'Enter') input.blur(); });
  }

  $('hours').addEventListener('input', () => {
    const el = $('hours');
    el.value = el.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1');
    touch('hours');
    calculate(false);
  });
  $('hours').addEventListener('blur', () => calculate(true));
  $('hours').addEventListener('keydown', ev => { if (ev.key === 'Enter') $('hours').blur(); });

  $('clear').addEventListener('click', () => {
    for (const k of KEYS) $(k).value = '';
    order = ['start', 'end', 'hours'];
    calculate(true);
    $('start').focus();
  });

  calculate(true);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
